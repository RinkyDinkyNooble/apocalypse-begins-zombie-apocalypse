
[General]
	#Allows a player to teleport to a located biome when in creative mode, opped, or in cheat mode.
	allowTeleport = true
	#Allows players to view the precise coordinates and distance of a located structure on the HUD, rather than relying on the direction the compass is pointing.
	displayCoordinates = true
	#biomeSize * radiusModifier = maxSearchRadius. Raising this value will increase search accuracy but will potentially make the process more resource .
	#Range: 0 ~ 1000000
	radiusModifier = 2500
	#biomeSize * sampleSpaceModifier = sampleSpace. Lowering this value will increase search accuracy but will make the process more resource intensive.
	#Range: 0 ~ 1000000
	sampleSpaceModifier = 16
	#A list of biomes that the compass will not be able to search for, specified by resource location. The wildcard character * can be used to match any number of characters, and ? can be used to match one character. Ex: ["minecraft:savanna", "minecraft:desert", "minecraft:*ocean*"]
	biomeBlacklist = ["phayriosisreborn:rotting_forest", "phayriosisreborn:primordial_hellscape", "phayriosisreborn:blooming_grove", "minecraft:the_void", "minecraft:ocean", "minecraft:deep_ocean", "minecraft:warm_ocean", "minecraft:lukewarm_ocean", "minecraft:deep_lukewarm_ocean", "minecraft:cold_ocean", "minecraft:deep_cold_ocean", "minecraft:frozen_ocean", "minecraft:deep_frozen_ocean", "minecraft:deep_dark", "minecraft:dripstone_caves", "minecraft:frozen_river", "minecraft:grove", "minecraft:ice_spikes", "minecraft:lush_caves", "minecraft:river", "minecraft:stony_peaks", "minecraft:stony_shore", "minecraft:jagged_peaks", "minecraft:frozen_peaks", "minecraft:the_end", "minecraft:small_end_islands", "minecraft:end_midlands", "minecraft:end_highlands", "minecraft:end_barrens", "minecraft:nether_wastes", "minecraft:soul_sand_valley", "minecraft:crimson_forest", "minecraft:warped_forest", "minecraft:basalt_deltas", "minecraft:beach", "minecraft:cherry_grove", "minecraft:meadow", "minecraft:mushroom_fields", "minecraft:sunflower_plains", "minecraft:flower_forest", "minecraft:forest", "minecraft:dark_forest", "minecraft:birch_forest", "minecraft:old_growth_birch_forest", "minecraft:old_growth_pine_taiga", "minecraft:old_growth_spruce_taiga", "minecraft:taiga", "minecraft:swamp", "minecraft:mangrove_swamp", "minecraft:windswept_forest", "minecraft:windswept_gravelly_hills", "minecraft:windswept_hills", "minecraft:windswept_savanna", "minecraft:snowy_beach", "minecraft:snowy_slopes", "minecraft:snowy_taiga", "minecraft:desert", "minecraft:eroded_badlands", "minecraft:wooded_badlands", "minecraft:jungle", "minecraft:sparse_jungle", "minecraft:bamboo_jungle", "minecraft:savanna", "minecraft:savanna_plateau"]
	#The maximum number of samples to be taken when searching for a biome.
	#Range: 0 ~ 1000000
	maxSamples = 50000
	#The maximum number of times a player can search for the next instance of a located biome. Set to 0 to disable searching for additional biome instances and make the compass always locate the nearest biome.
	#Range: 0 ~ 10000
	maxNextSearches = 25
	#The default number of XP levels consumed when searching for a biome. Individual biomes can be configured via perBiomeXpLevels.
	#Range: 0 ~ 3
	defaultXpLevels = 0
	#A list of per-biome XP level costs that override defaultXpLevels, specified as comma-separated "biome_id,num_levels" pairs. Biomes not listed here use defaultXpLevels. Max of 3 levels. The wildcard character * can be used to match any number of characters, and ? can be used to match one character. Ex: ["minecraft:deep_dark,3", "minecraft:end*,2", "minecraft:*caves,3"]
	perBiomeXpLevels = []
	#The number of successful biome searches before the compass breaks and must be repaired. Set to 0 to disable durability.
	#Range: 0 ~ 10000
	compassDurability = 0

